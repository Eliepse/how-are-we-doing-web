<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>AIA - How Are We?</title>

	<style>
        :root {
            --dark-blue: #141333;
            --dark-blue-hsl: 242, 63%, 20%;
            --red-hex: #e3032e;
            --red: rgb(228, 3, 47);
            --red-hsl: hsl(348 98% 45%);
            --dark-white: rgba(255, 255, 255, 0.16);
            --color-secondary: #de7f7d;
            --sans-serif: InterVariable, sans-serif;
            font-size: 1rem;

            --1px: .0625rem;
            --0-5: .125rem;
            --1: .25rem;
            --1-5: .375rem;
            --2: .5rem;
            --2-5: .625rem;
            --3: .75rem;
            --3-5: .875rem;
            --4: 1rem;
            --8: 2rem;
            --10: 2.5rem;
            --12: 3rem;
            --16: 4rem;
        }

        /*
		| --------------------------------
		| Splashscreen
		| --------------------------------
		*/

        #splash {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--dark-blue);
            z-index: 999;
            transition: opacity 1000ms ease-in;
            text-align: center;
        }

        #splash > div {
            max-width: 32rem;
        }

        #splash h1 {
            margin: 0 0 1em 0;
            font-size: 2.75rem;
        }

        #splash p {
            font-size: 1.15rem;
            font-weight: bold;
        }

        #splash cite {
            font-size: .75rem;
            font-style: normal;
            opacity: .4;
        }

        /*
		| --------------------------------
		| Loader
		| --------------------------------
		*/

        .loaderBox {
            width: 100%;
            max-width: 280px;
            margin: 4rem auto;
        }

        .loader__progress {
            position: relative;
            height: 12px;
            border-radius: 6px;
            border: 1px solid white;
        }

        .loader__progressBar {
            width: 0;
            height: 100%;
            background: white;
            border-radius: 4px;
            transition: width 350ms ease-out;
            overflow: hidden;
        }
	</style>
</head>
<body>

<div id="splash">
	<div>
		<h1>Ce qui nous lie</h1>
		<p>
			Explorer l'exposome urbain pour mieux comprendre<br />
			les liens entre cadre de vie et santé
		</p>

		<div class="loaderBox">
			<div class="loader__progress">
				<div class="loader__progressBar"></div>
			</div>
		</div>

		<cite>&copy; 2026 FONDATION AIA</cite>
	</div>
</div>

		<div style="justify-self: start; display: flex; gap: .5rem">
			<button data-action="locale:toggle" style="text-transform: uppercase" data-locale-current>
				FR
			</button>
			<button data-action="credits:open" data-translate="general.credits">Credits
			</button>
		</div>

		<ul id="modes">

					Simple

			</li>
			<li>

				</button>
			</li>
			<li>
				<button data-action="mode:change" data-mode="focus" data-translate="general.controls.mode.focus">
					Determinants
				</button>
			</li>
		</ul>

		<div style="justify-self: end">
			<button id="biblioToggle" style="margin-left: 8px">Bibliography</button>
		</div>
	</div>
