<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>AIA - How Are We? [WALL]</title>
	<link href="wall.css" rel="stylesheet" />
	<style>
        /*
		| --------------------------------
		| Loader
		| --------------------------------
		*/

        #loader {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--dark-blue);
            z-index: 100;
            transition: opacity 1000ms ease-in;
        }

        .loaderBox {
            width: 100%;
            max-width: 320px;
        }

        .loader__progress {
            display: flex;
            align-items: center;
        }

        .loader__progressBar {
            position: relative;
            flex: 1;
            height: 16px;
            border-radius: 6px;
            border: 1px solid white;
        }

        .loader__progressBar div {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            background: white;
            border-radius: 4px;
            transition: width 350ms ease-out;
        }

        .loader__progressCounter {
            flex: none;
            width: 54px;
            line-height: 1;
            text-align: right;
            font-size: 14px;
        }

        .loader__title {
            margin-top: 8px;
            text-align: left;
            font-size: 14px;
        }
	</style>
</head>
<body>

<div id="loader" style="">
	<div class="loaderBox">
		<div class="loader__progress">
			<div class="loader__progressBar">
				<div></div>
			</div>
			<div class="loader__progressCounter">0 %</div>
		</div>
		<div class="loader__title">Loading...</div>
	</div>
</div>

<div id="wall">
</div>

<script type="module" src="wall.ts"></script>
</body>
</html>
